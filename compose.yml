services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: ec2,sts,elbv2,lambda,ecs,eks,iam,autoscaling,rds,elasticache,redshift,opensearch,dynamodb,s3,ecr
      DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    volumes:
      - .localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
